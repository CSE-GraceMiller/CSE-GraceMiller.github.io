<!DOCTYPE html>
<html>
    <head>
        <title>Assignment 7 - Introduction to JavaScript</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="page">
            <!-- header -->
             <header class="header">
                <div class="header-content">
                    <h1>Assignment 7</h1>
                    <h2>Introduction to JavaScript</h2>
                </div>
            </header>
            <!-- columns -->
             <main class="cards">
                <section class="card">
                    <h3>Speech</h3>
                    <div class="card-body">
                        <p class="speech">Hi</p>
                    </div>
                </section>
                <!-- bev card -->
                 <section class="card">
                    <h3>Beverage</h3>
                    <label for="beverage">Pick your morning beverage:</label>
                    <select id="beverage">
                        <option value="">-- Choose --</option>
                        <option value="Coffee">Coffee</option>
                        <option value="Tea">Tea</option>
                        <option value="Orange Juice">Orange Juice</option>
                        <option value="Water">Water</option>
                        <option value="Smoothie">Smoothie</option>
                    </select>
                    <p id="beverage-message" class="beverage-message"></p>
                </section>
                <!-- sticker card -->
                 <section class="card">
                    <h3>Add a Sticker</h3>
                    <div class="card-body sticker-area">
                        <div class="sun" id="sun">☀️</div>
                        </div>
                    </section>
                </main>
                <!-- footer -->
                 <footer class="footer">
                    <p>&copy; gracemiller</p>
                </footer>
            </div>
            <script src="scripts/script.js"></script>
    </body>
</html>
